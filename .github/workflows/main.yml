name: TCG Stock Tracker

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write # IMPORTANT: This gives the bot permission to save the JSON file to your repo

jobs:
  check-stock:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        playwright install chromium

    - name: Run Tracker
      env:
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: python main.py 

    # NEW STEP: Commits the prices.json file back to the repository
    - name: Save price data back to repository
      run: |
        git config --global user.name "GitHub Action Bot"
        git config --global user.email "action@github.com"
        git add prices.json
        # Only commit and push if prices.json actually changed
        git diff --quiet && git diff --staged --quiet || (git commit -m "Update prices memory" && git push)
